<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio - Selección de Temporada</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #ffffff;
    }

    /* Contenedor del Carrusel de Fondo */
    .carousel-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    /* Capa oscura superpuesta para mejorar la legibilidad del texto */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: -1;
    }

    /* Capa de Contenido Principal */
    .main-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 0 20px;
    }

    .title {
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    /* Menú de Selección de Temporada */
    .season-menu {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .season-card {
      display: inline-block;
      padding: 18px 40px;
      font-size: 1.2rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .season-card:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: #ffffff;
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>

  <div class="carousel-container">
    <div class="slide active" style="background-image: url('https://picsum.photos/1920/1080?random=1');"></div>
    <div class="slide" style="background-image: url('https://picsum.photos/1920/1080?random=2');"></div>
    <div class="slide" style="background-image: url('https://picsum.photos/1920/1080?random=3');"></div>
  </div>

  <div class="overlay"></div>

  <main class="main-content">
    <h1 class="title">Selecciona Temporada</h1>
    
    <nav class="season-menu">
      <a href="temporadaFantasy25-26.html" class="season-card">Temporada 25/26</a>
      <a href="temporadaFantasy25-27.html" class="season-card">Temporada 26/27</a>
    </nav>
  </main>

  <script>
    // Rotación automática del fondo cada 5 segundos
    const slides = document.querySelectorAll('.slide');
    let currentSlide = 0;

    function nextSlide() {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }

    setInterval(nextSlide, 5000);
  </script>

</body>
</html>
